name: Bug report
description: File a bug report
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: description
    attributes:
      label: What happened?
      description: Describe the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
  - type: input
    id: version
    attributes:
      label: Version
